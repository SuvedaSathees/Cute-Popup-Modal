<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Styled Popup</title>
    <style>
        body {
            font-family: 'Comic Sans MS', cursive, sans-serif;
            background-color: #fce4ec;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        button {
            background-color: #ff80ab;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 16px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s ease, background-color 0.2s ease;
        }
        button:hover {
            background-color: #ff4081;
            transform: scale(1.1);
        }
        .popup {
            padding: 20px;
            text-align: center;
            margin-left: auto;
            margin-right: auto;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 350px;
            background-color: #ffe0f0;
            border-radius: 15px;
            box-shadow: 0 8px 12px rgba(0, 0, 0, 0.2);
            color: #880e4f;
            display: none;
        }
        .popup p {
            font-size: 14px;
            margin-bottom: 15px;
            line-height: 1.5;
        }
        .popup button {
            background-color: #ff80ab;
            color: white;
            padding: 8px 15px;
            border-radius: 15px;
            font-size: 14px;
        }
        .popup button:hover {
            background-color: #ff4081;
        }
    </style>
</head>
<body>
    <button onclick="show()">Click Me!</button>
    <div class="popup"> 
        <p>Lorem ipsum dolor sit amet, consectetur adipisicing elit. Fuga animi necessitatibus sed cupiditate quibusdam odit, perspiciatis quas provident vero assumenda nemo at maiores eos, ullam, tempore inventore delectus voluptatum iste?</p>
        <button onclick="cl()">Close</button>
    </div>
    <script>
        var pop = document.querySelector(".popup");
        function show() {
            pop.style.display = "block";
        }
        function cl() {
            pop.style.display = "none";
        }
    </script>
</body>
</html>
